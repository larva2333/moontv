[build]
  # 强制先清掉 .next，避免 Netlify 构建缓存复用旧的静态 chunk，
  # 否则会出现「服务端代码已更新、但 /_next/static 静态资源仍是旧版本」的错位（#418 修不掉）。
  command = "rm -rf .next && pnpm build"
  # 不手动指定 publish：交给 @netlify/plugin-nextjs 全权管理发布目录，
  # 手动写 publish = ".next" 会与该 plugin 冲突，导致静态资源版本与函数代码版本不一致。

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
